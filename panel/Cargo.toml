[package]
name = "panel"
version = "0.2.0-alpha"
edition = "2021"

[lib]
name = "panel"
path = "src/lib.rs"

[[bin]]
name = "panel"
path = "src/main.rs"

[[bin]]
name = "yunexal-cli"
path = "src/bin/yunexal-cli.rs"

[dependencies]
aes-gcm = "0.10.3"
argon2 = "0.5"
chacha20poly1305 = "0.10"
askama = "0.15.1"
axum = { version = "0.8.8", features = ["multipart"] }
axum-extra = { version = "0.12.5", features = ["cookie"] }
base64 = "0.22.1"
sea-orm = { version = "1.0", features = [ "sqlx-postgres", "sqlx-sqlite", "sqlx-mysql", "runtime-tokio-rustls", "macros" ] }
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4.42", features = ["serde"] }
dotenv = "0.15.0"
rand = { version = "0.9.2", features = ["std", "std_rng"] }
redis = { version = "1.0.2", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.13.1", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
serde_yaml = "0.9.34-deprecated"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "sqlite", "uuid", "chrono", "any"] }
time = "0.3.44"
tokio = { version = "1.48.0", features = ["full"] }
tower-http = { version = "0.6.8", features = ["fs"] }
tracing = "0.1.44"
tracing-appender = "0.2.4"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
uuid = { version = "1.19.0", features = ["v4", "serde"] }
tonic = "0.11"
prost = "0.12"
tokio-stream = "0.1"

[build-dependencies]
tonic-build = "0.11"
